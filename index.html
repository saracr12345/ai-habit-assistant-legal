<!doctype html>
<html lang="en-GB">
<head>

<title>Legal · AI Habit Assistant</title>

<style>
  :root { --bg:#ffffff; --surface:#e6f3fd; --text:#1a202c; --muted:#667085; --accent:#3d95d8; --accent-deep:#1f6fb0; --border:#e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1720; --surface:#182a38; --text:#f2f5f8; --muted:#9aa6b5; --accent:#7cc0f2; --accent-deep:#9fd2f7; --border:#243040; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 16px; }
  .brand { display:flex; align-items:center; gap:12px; color:var(--accent-deep); font-weight:600; }
  .brand-dot { width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff 0%, var(--accent) 60%, var(--accent-deep) 100%); }
  h1 { font-size:1.75rem; margin:16px 0 24px; }
  a.card { display:block; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin:12px 0;
    color:var(--text); text-decoration:none; font-weight:600; }
  a.card span { display:block; color:var(--muted); font-weight:400; font-size:0.95rem; }
  footer { margin-top:32px; color:var(--muted); font-size:0.9rem; }
  a { color:var(--accent-deep); }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span>AI Habit Assistant</div>
